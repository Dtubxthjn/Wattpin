name: Publish beta release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: read
concurrency:
  group: wattpin-beta-release
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install '.[dev]' 'pyinstaller>=6,<7'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and audit source packages
        run: |
          python -m build
          python -m tools.verify_release
          python -m tools.export_github
          python -m tools.privacy_check dist/wattpin-0.4.4-github-source.zip
      - name: Build Linux installer
        run: |
          python packaging/build_app.py
          python packaging/build_linux_installer.py
      - name: Frozen application self-test
        run: build-output/linux/Wattpin/Wattpin --self-test
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-and-source
          path: |
            dist/Wattpin-0.4.4-Linux-x86_64.run
            dist/wattpin-0.4.4-py3-none-any.whl
            dist/wattpin-0.4.4.tar.gz
            dist/wattpin-0.4.4-github-source.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: choco install nsis --yes --no-progress
      - run: ./packaging/windows/build.ps1
        shell: pwsh
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install, self-test, and uninstall
        shell: pwsh
        run: |
          $Setup = (Resolve-Path dist/Wattpin-0.4.4-Windows-x64-Setup.exe).Path
          $Target = "$env:LOCALAPPDATA\Wattpin-CI"
          $Process = Start-Process $Setup -ArgumentList '/S',"/D=$Target" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw 'Setup failed' }
          $App = Start-Process "$Target\Wattpin.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($App.ExitCode -ne 0) { throw 'Bundled UI self-test failed' }
          Start-Process "$Target\Uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$Target\Wattpin.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$Target\Wattpin.exe") { throw 'App was not uninstalled' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Wattpin-0.4.4-Windows-x64-Setup.exe
          if-no-files-found: error
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and write checksums
        run: python -m tools.release_assets release-assets
      - name: Publish 0.4.4 beta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = 'v0.4.4-beta';
            const params = {owner: context.repo.owner, repo: context.repo.repo};
            let existing;
            try { existing = (await github.rest.repos.getReleaseByTag({...params, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing && !existing.draft) {
              core.setFailed('This beta release is already published. Use a new version for new binaries.');
              return;
            }
            const release = existing || (await github.rest.repos.createRelease({
              ...params, tag_name: tag, target_commitish: context.sha,
              name: 'Wattpin 0.4.4 Beta', draft: true, prerelease: true,
              body: fs.readFileSync('docs/RELEASE_NOTES_0.4.4.md', 'utf8')
            })).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...params, release_id: release.id});
            for (const name of fs.readdirSync('release-assets').sort()) {
              const data = fs.readFileSync(path.join('release-assets', name));
              const previous = assets.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({...params, asset_id: previous.id});
              await github.rest.repos.uploadReleaseAsset({...params, release_id: release.id, name, data});
            }
            await github.rest.repos.updateRelease({...params, release_id: release.id, draft: false, prerelease: true});
            core.notice(`Published https://github.com/${params.owner}/${params.repo}/releases/tag/${tag}`);
