name: Feature request
description: Suggest an improvement to Wattpin.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include your platform and any alternatives you have considered.
    validations:
      required: true
